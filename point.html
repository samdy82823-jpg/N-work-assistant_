<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>點數換算工具</title>

    <link rel="stylesheet" href="css/point.css">

</head>

<body>

<div class="container">

    <h1>💰 點數換算工具</h1>

    <label>請輸入消費金額（元）</label>

    <input
        type="number"
        id="money"
        placeholder="例如：15687">

    <div class="button-group">

        <button id="calculate">
            開始計算
        </button>

        <button id="clear">
            清除
        </button>

    </div>

</div>
<div id="result" class="result-card">

<h2>🎉 計算結果</h2>

<div class="point-item">

    <div class="point-title">
        一般點數（2%）
    </div>

    <div class="point-value">
        <span id="normalPoint">0</span> 點
    </div>

    <div class="point-desc blue">
        下次消費即可折抵
    </div>

</div>

<hr>

<div class="point-item">

    <div class="point-title">
        限期點數（8%）
    </div>

    <div class="point-value">
        <span id="eventPoint">0</span> 點
    </div>

    <div class="point-desc red">
        使用期限2026/8/10-2026/8/30 
    </div>

    <div class="point-date red">
        <span id="eventDate"></span>
    </div>

</div>

</div>

    <hr>

    <div class="success-text">

        🎉 恭喜您！

        本次消費獲得

        <span id="messageTotal">0</span>

        點會員點數！

    </div>

</div>

</div>

</div>
</body>

</html>
<script src="js/setting.js"></script>
<script src="js/point.js"></script>
