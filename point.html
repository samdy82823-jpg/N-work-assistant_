<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>點數計算器</title>

    <link rel="stylesheet" href="css/point.css">

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&display=swap" rel="stylesheet">

</head>

<body>

<div class="container">

    <h1>🎁 點數計算器</h1>

    <label>請輸入消費金額</label>

    <input
        id="money"
        type="number"
        placeholder="例如：5600">

    <div class="button-group">

        <button id="calculate">
            開始計算
        </button>

        <button id="clear">
            清除
        </button>

    </div>

    <div id="result" class="result-card">

    <h2>🎉 計算結果</h2>

    <div class="total-card">

        <div class="total-title">
            總點數
        </div>

        <div class="total-number">
            <span id="totalPoint">0</span>
            <span class="point-unit">點</span>
        </div>

    </div>

    <div class="tip">
        💡 1 點可以折抵 1 元
    </div>

    <hr>

    <!-- 一般點數 -->

    <div class="point-item">

        <div class="point-title">
            🟢 一般點數（2%）
        </div>

        <div class="point-value">
            <span id="normalPoint">0</span> 點
        </div>

        <div class="point-desc blue">
            下次消費即可折抵
        </div>

    </div>

    <hr>

    <!-- 限期點數 -->

    <div class="point-item">

        <div class="point-title">
            🟠 限期點數（8%）
        </div>

        <div class="point-value">
            <span id="eventPoint">0</span> 點
        </div>

        <div class="point-desc red">
            使用期限
        </div>

        <div class="point-date red">
            <span id="eventDate"></span>
        </div>

    </div>

    <hr>

    <div class="success-text">

        🎉 恭喜您！

        <br><br>

        本次消費獲得

        <br>

        <span id="messagePoint">0</span>

        點會員點數！

    </div>

</div>

</div>

<script src="js/setting.js"></script>

<script src="js/point.js"></script>

</body>

</html>
